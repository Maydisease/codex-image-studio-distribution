<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DarkRoom</title>
    <meta name="description" content="DarkRoom for macOS. Download the latest release." />
    <link rel="icon" href="./app-icon-512.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #f6f4ee;
        --paper: #fffefa;
        --ink: #171914;
        --muted: #686b62;
        --faint: #96998f;
        --line: #dfddd3;
        --line-strong: #cac7bc;
        --accent: #1d2a21;
        --accent-hover: #121a15;
        --shadow: 0 24px 70px rgba(35, 38, 31, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at 18% 12%, rgba(255, 255, 255, 0.92), transparent 28%),
          linear-gradient(rgba(23, 25, 20, 0.028) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 25, 20, 0.028) 1px, transparent 1px),
          var(--page);
        background-size: auto, 34px 34px, 34px 34px, auto;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(1080px, calc(100vw - 40px));
        min-height: 100vh;
        margin: 0 auto;
        padding: 24px 0 38px;
        display: grid;
        grid-template-rows: auto 1fr auto;
      }

      .topbar,
      .footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }

      .brand img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 600;
      }

      .nav-link {
        color: var(--muted);
        font-size: 14px;
        text-decoration: none;
      }

      .nav-link:hover {
        color: var(--ink);
      }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 360px;
        gap: 64px;
        align-items: center;
        padding: 70px 0 58px;
      }

      .copy {
        max-width: 620px;
      }

      .eyebrow {
        width: fit-content;
        margin-bottom: 24px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 254, 250, 0.68);
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
        letter-spacing: 0.02em;
      }

      h1 {
        margin: 0;
        font-family: "Newsreader", ui-serif, serif;
        font-size: clamp(64px, 11vw, 128px);
        line-height: 0.84;
        font-weight: 600;
        letter-spacing: -0.055em;
      }

      .intro {
        max-width: 500px;
        margin: 28px 0 0;
        color: var(--muted);
        font-size: 18px;
        line-height: 1.78;
      }

      .actions {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 34px;
      }

      .download,
      .release-notes {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 20px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .download {
        min-width: 166px;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: #fff;
      }

      .download:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }

      .release-notes {
        min-width: 112px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 254, 250, 0.74);
        color: var(--ink);
      }

      .release-notes:hover {
        border-color: #aaa79b;
        transform: translateY(-1px);
      }

      .panel {
        position: relative;
        padding: 30px;
        border: 1px solid rgba(202, 199, 188, 0.82);
        border-radius: 30px;
        background: rgba(255, 254, 250, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(18px);
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 12px;
        border: 1px solid rgba(223, 221, 211, 0.72);
        border-radius: 22px;
        pointer-events: none;
      }

      .app-icon {
        width: 92px;
        height: 92px;
        border-radius: 22px;
        box-shadow: 0 18px 38px rgba(31, 39, 34, 0.14);
      }

      .panel-title {
        margin: 28px 0 4px;
        font-size: 14px;
        color: var(--muted);
      }

      .version {
        margin: 0;
        font-family: "Newsreader", ui-serif, serif;
        font-size: 44px;
        line-height: 1;
        font-weight: 600;
        letter-spacing: -0.03em;
      }

      .facts {
        display: grid;
        gap: 0;
        margin-top: 28px;
        border-top: 1px solid var(--line);
      }

      .fact {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 14px 0;
        border-bottom: 1px solid var(--line);
        font-size: 13px;
      }

      .fact span:first-child {
        color: var(--muted);
      }

      .fact span:last-child {
        font-weight: 600;
      }

      .install {
        margin: 22px 0 0;
        color: var(--faint);
        font-size: 12px;
        line-height: 1.7;
      }

      .footer {
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .shell {
          width: min(100vw - 28px, 1080px);
          padding-top: 18px;
        }

        .hero {
          grid-template-columns: 1fr;
          gap: 34px;
          padding: 48px 0 34px;
        }

        .copy {
          max-width: none;
        }

        .intro {
          font-size: 16px;
        }

        .panel {
          width: 100%;
          padding: 24px;
          border-radius: 24px;
        }

        .panel::before {
          display: none;
        }

        .footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }
      }

      @media (max-width: 520px) {
        .topbar {
          align-items: flex-start;
        }

        h1 {
          font-size: 66px;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .download,
        .release-notes {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="DarkRoom">
          <img src="./app-icon-512.png" alt="" />
          <span class="brand-name">DarkRoom</span>
        </a>
        <a class="nav-link" href="https://maydisease.github.io/codex-image-studio-distribution/releases/0.13.5.html">版本说明</a>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="copy">
          <div class="eyebrow">macOS 图片工作台</div>
          <h1 id="page-title">DarkRoom</h1>
          <p class="intro">一间为图片生成准备的本地暗房。把出图、筛选、收藏和回溯，放进一个安静的 macOS 工作台。</p>

          <div class="actions">
            <a class="download" href="https://maydisease.github.io/codex-image-studio-distribution/downloads/codex-image-studio-macos-0.13.5.zip">下载 Apple Silicon 版</a>
            <a class="release-notes" href="https://maydisease.github.io/codex-image-studio-distribution/downloads/codex-image-studio-macos-intel-0.13.5.zip">下载 Intel 版</a>
            <a class="release-notes" href="https://maydisease.github.io/codex-image-studio-distribution/releases/0.13.5.html">版本说明</a>
          </div>
        </div>

        <aside class="panel" aria-label="下载信息">
          <img class="app-icon" src="./app-icon-512.png" alt="" />
          <p class="panel-title">当前版本</p>
          <p class="version">v0.13.5</p>
          <div class="facts">
            <div class="fact">
              <span>系统</span>
              <span>macOS 13.0+</span>
            </div>
            <div class="fact">
              <span>平台</span>
              <span>Apple Silicon / Intel</span>
            </div>
            <div class="fact">
              <span>更新</span>
              <span>支持应用内检查</span>
            </div>
          </div>
          <p class="install">下载后解压，将 DarkRoom 移动到“应用程序”目录即可使用。</p>
        </aside>
      </section>

      <footer class="footer">
        <span>DarkRoom macOS</span>
        <span>当前版本 v0.13.5</span>
      </footer>
    </main>
  </body>
</html>
