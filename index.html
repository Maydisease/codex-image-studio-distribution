<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DarkRoom</title>
    <meta name="description" content="DarkRoom for macOS. Download the latest release." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --page: #f7f7f4;
        --surface: #ffffff;
        --ink: #171915;
        --muted: #6f726c;
        --faint: #a3a69f;
        --line: #dedfd9;
        --line-strong: #c9cbc4;
        --button: #1f2722;
        --button-hover: #141a16;
      }

      * {
        box-sizing: border-box;
      }

      html {
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans", ui-sans-serif, sans-serif;
        color: var(--ink);
        background:
          linear-gradient(rgba(23, 25, 21, 0.025) 1px, transparent 1px),
          linear-gradient(90deg, rgba(23, 25, 21, 0.025) 1px, transparent 1px),
          var(--page);
        background-size: 28px 28px;
      }

      a {
        color: inherit;
      }

      .shell {
        width: min(980px, calc(100vw - 36px));
        margin: 0 auto;
        padding: 26px 0 54px;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }

      .brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0;
      }

      .nav-link {
        padding: 9px 0;
        color: var(--muted);
        font-size: 14px;
        text-decoration: none;
      }

      .nav-link:hover {
        color: var(--ink);
      }

      .hero {
        min-height: calc(100vh - 160px);
        display: grid;
        align-items: center;
        justify-items: center;
        padding: 62px 0 44px;
      }

      .release {
        width: min(620px, 100%);
        text-align: center;
      }

      .app-icon {
        width: 86px;
        height: 86px;
        margin-bottom: 26px;
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(31, 39, 34, 0.12);
      }

      h1 {
        margin: 0;
        font-family: "Newsreader", ui-serif, serif;
        font-size: 74px;
        line-height: 0.95;
        font-weight: 600;
        letter-spacing: 0;
      }

      .intro {
        width: min(460px, 100%);
        margin: 20px auto 0;
        color: var(--muted);
        font-size: 17px;
        line-height: 1.7;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 26px;
      }

      .pill {
        min-height: 34px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 13px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.68);
        color: var(--muted);
        font-size: 13px;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 32px;
      }

      .download,
      .release-notes {
        min-height: 48px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 0 20px;
        font-size: 15px;
        font-weight: 600;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          background 160ms ease;
      }

      .download {
        min-width: 156px;
        border: 1px solid var(--button);
        background: var(--button);
        color: #fff;
      }

      .download:hover {
        background: var(--button-hover);
        transform: translateY(-1px);
      }

      .release-notes {
        min-width: 116px;
        border: 1px solid var(--line-strong);
        background: rgba(255, 255, 255, 0.74);
        color: var(--ink);
      }

      .release-notes:hover {
        border-color: #aeb1aa;
        transform: translateY(-1px);
      }

      .fine-print {
        margin-top: 18px;
        color: var(--faint);
        font-size: 12px;
      }

      @media (max-width: 640px) {
        .shell {
          width: min(100vw - 28px, 980px);
          padding-top: 18px;
          padding-bottom: 32px;
        }

        .hero {
          min-height: calc(100vh - 118px);
          padding: 48px 0 28px;
        }

        .app-icon {
          width: 74px;
          height: 74px;
          border-radius: 18px;
        }

        h1 {
          font-size: 54px;
        }

        .intro {
          font-size: 15px;
        }

        .actions {
          align-items: stretch;
          flex-direction: column;
        }

        .download,
        .release-notes {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="DarkRoom">
          <img src="./app-icon-512.png" alt="" />
          <span class="brand-name">DarkRoom</span>
        </a>
        <a class="nav-link" href="./releases/0.1.12.html">版本说明</a>
      </header>

      <section class="hero" aria-labelledby="page-title">
        <div class="release">
          <img class="app-icon" src="./app-icon-512.png" alt="" />
          <h1 id="page-title">DarkRoom</h1>
          <p class="intro">面向 macOS 的图片工作台。整理、收藏、回收与继续创作，都在一个干净的桌面窗口里完成。</p>

          <div class="meta" aria-label="版本信息">
            <span class="pill">v0.1.12</span>
            <span class="pill">macOS 13+</span>
          </div>

          <div class="actions">
            <a class="download" href="./downloads/codex-image-studio-macos-0.1.12.zip">下载 DarkRoom</a>
            <a class="release-notes" href="./releases/0.1.12.html">版本说明</a>
          </div>

          <p class="fine-print">下载后解压并移动到“应用程序”。</p>
        </div>
      </section>
    </main>
  </body>
</html>
